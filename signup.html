<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Stackly Dental</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="back-btn-top">&larr; Back to Home</a>
      
      <div class="auth-logo">
        <a href="index.html"><img src="images/logo-stackly.webp" alt="Stackly Dental" style="filter: brightness(0);" /></a>
      </div>
      
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Join us to easily manage appointments and dental records.</p>

      <form onsubmit="event.preventDefault(); handleSignup();" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label>First Name <span class="required">*</span></label>
            <input type="text" class="form-control" id="regFName" placeholder="John" required pattern="[A-Za-z\s]+" onblur="validateField(this)" />
            <div class="form-error"></div>
          </div>
          <div class="form-group">
            <label>Last Name <span class="required">*</span></label>
            <input type="text" class="form-control" id="regLName" placeholder="Doe" required pattern="[A-Za-z\s]+" onblur="validateField(this)" />
            <div class="form-error"></div>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address <span class="required">*</span></label>
          <input type="email" class="form-control" id="regEmail" placeholder="you@example.com" required onblur="validateField(this)" />
          <div class="form-error"></div>
        </div>
        
        <div class="form-group">
          <label>Phone Number <span class="required">*</span></label>
          <input type="tel" class="form-control" id="regPhone" placeholder="10 digit number" required pattern="\\d{10}" onblur="validateField(this)" />
          <div class="form-error"></div>
        </div>
        
        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="regPassword" placeholder="Min 6 chars" required minlength="6" onblur="validateField(this)" />
            <button type="button" class="password-toggle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="form-error"></div>
        </div>
        
        <button type="submit" id="submitBtn" class="btn btn-accent" style="width:100%; justify-content:center; margin-top: 1rem;">Create Account</button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in instead</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function handleSignup() {
      const inputs = ['regFName', 'regLName', 'regEmail', 'regPhone', 'regPassword'].map(id => document.getElementById(id));
      let valid = true;
      inputs.forEach(input => {
        if(!validateField(input)) valid = false;
      });
      
      if(valid) {
        const btn = document.getElementById('submitBtn');
        btn.textContent = 'Creating...';
        btn.disabled = true;
        
        setTimeout(() => {
          const fullName = inputs[0].value.trim() + ' ' + inputs[1].value.trim();
          const res = authSignup(fullName, inputs[2].value, inputs[4].value, inputs[3].value, 'staff');
          if (res.success) {
            window.location.href = 'dashboard.html';
          }
        }, 1000);
      }
    }
  </script>
</body>
</html>
