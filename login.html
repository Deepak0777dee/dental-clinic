<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Stackly Dental</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="back-btn-top">&larr; Back to Home</a>
      
      <div class="auth-logo">
        <a href="index.html"><img src="images/logo-stackly.webp" alt="Stackly Dental" style="filter: brightness(0);" /></a>
      </div>
      
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to manage your appointments and records.</p>
      
      <div class="role-selector" id="roleSelector">
        <button class="role-option active" data-role="staff" onclick="selectRole(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Patient / Staff
        </button>
        <button class="role-option" data-role="doctor" onclick="selectRole(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Doctor / Admin
        </button>
      </div>

      <form onsubmit="event.preventDefault(); handleLogin();" novalidate>
        <div class="form-group">
          <label>Email Address <span class="required">*</span></label>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required onblur="validateField(this)" />
          <div class="form-error"></div>
        </div>
        
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <label style="margin-bottom:0;">Password <span class="required">*</span></label>
            <a href="404.html" style="font-size:0.85rem; text-decoration:none; color:var(--accent);">Forgot password?</a>
          </div>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required minlength="6" onblur="validateField(this)" />
            <button type="button" class="password-toggle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="form-error"></div>
        </div>
        
        <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%; justify-content:center; margin-top: 1rem;">Sign In to Dashboard</button>
      </form>
      
      <div class="auth-footer">
        New to Stackly Dental? <a href="signup.html">Create an account</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let selectedRole = 'staff';
    
    function selectRole(el) {
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      selectedRole = el.dataset.role;
    }

    function handleLogin() {
      const emailInput = document.getElementById('loginEmail');
      const passInput = document.getElementById('loginPassword');
      const v1 = validateField(emailInput);
      const v2 = validateField(passInput);
      
      if(v1 && v2) {
        const btn = document.getElementById('submitBtn');
        btn.textContent = 'Authenticating...';
        btn.disabled = true;
        
        setTimeout(() => {
          const res = authLogin(emailInput.value, passInput.value, selectedRole);
          if (res.success) {
            window.location.href = 'dashboard.html';
          }
        }, 800);
      }
    }
  </script>
</body>
</html>
